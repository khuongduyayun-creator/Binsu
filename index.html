                img.loading = 'lazy';
                img.dataset.fallback = 'gallery';
                attachImageFallback(img);

                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                overlay.innerHTML = '<i class="fas fa-search-plus"></i>';

                item.appendChild(img);
                item.appendChild(overlay);
                item.addEventListener('click', () => open(i));
                grid.appendChild(item);
            });

            const overlay   = $('#lightboxOverlay');
            const lbImage   = $('#lightboxImage');
            const lbCounter = $('#lightboxCounter');
            const lbClose   = $('#lightboxClose');
            const lbPrev    = $('#lightboxPrev');
            const lbNext    = $('#lightboxNext');

            let currentIdx = 0;
            let lastFocus  = null;

            function open(index) {
                currentIdx = index;
                lastFocus = document.activeElement;
                render();
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                lbClose.focus();
            }
            function close() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
                if (lastFocus && lastFocus.focus) lastFocus.focus();
            }
            function render() {
                lbImage.src = images[currentIdx];
                lbImage.alt = 'Ảnh ' + (currentIdx + 1);
                lbCounter.textContent = (currentIdx + 1) + ' / ' + images.length;
            }
            function prev() { currentIdx = (currentIdx - 1 + images.length) % images.length; render(); }
            function next() { currentIdx = (currentIdx + 1) % images.length; render(); }

            lbClose.addEventListener('click', close);
            lbPrev.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
            lbNext.addEventListener('click', (e) => { e.stopPropagation(); next(); });
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

            document.addEventListener('keydown', (e) => {
                if (!overlay.classList.contains('active')) return;
                if (e.key === 'Escape') close();
                if (e.key === 'ArrowLeft')  prev();
                if (e.key === 'ArrowRight') next();
            });

            let touchX = 0, touchY = 0;
            overlay.addEventListener('touchstart', (e) => {
                touchX = e.changedTouches[0].clientX;
                touchY = e.changedTouches[0].clientY;
            }, { passive: true });
            overlay.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - touchX;
                const dy = e.changedTouches[0].clientY - touchY;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                    dx > 0 ? prev() : next();
                }
            }, { passive: true });
        })();

            let raf = null;
            function update() {
                const h = document.documentElement;
                const max = h.scrollHeight - h.clientHeight;
                const y = h.scrollTop || document.body.scrollTop;
                const pct = max > 0 ? (y / max) * 100 : 0;
                bar.style.width = pct + '%';
                top.classList.toggle('visible', y > 320);
                raf = null;
            }
            window.addEventListener('scroll', () => {
                if (raf) return;
                raf = requestAnimationFrame(update);
            }, { passive: true });
            update();

            top.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: prefersReduced ? 'auto' : 'smooth' });
            });
        })();

        (function initReveal() {
            const els = $$('.reveal');
            if (!('IntersectionObserver' in window)) {
                els.forEach(el => el.classList.add('visible'));
                return;
            }
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.classList.add('visible');
                        obs.unobserve(e.target);
                    }
                });
            }, { threshold: 0.15 });
            els.forEach(el => obs.observe(el));
        })();

        (function initClock() {
            const el = $('#clockDisplay');
            function tick() {
                const n = new Date();
                const hh = String(n.getHours()).padStart(2, '0');
                const mm = String(n.getMinutes()).padStart(2, '0');
                const ss = String(n.getSeconds()).padStart(2, '0');
                el.innerHTML = '<i class="far fa-clock"></i> ' + hh + ':' + mm + ':' + ss;
            }
            tick();
            setInterval(tick, 1000);
        })();

        document.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
            if (e.code === 'Space' && !$('#lightboxOverlay').classList.contains('active')) {
                if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
                e.preventDefault();
                Player.toggle();
            }
        });
    })();
    </script>

</body>
