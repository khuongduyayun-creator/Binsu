<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0718" />
    <meta name="description" content="BinSu — hồ sơ cá nhân, khoảnh khắc và playlist." />
    <meta name="color-scheme" content="dark" />
    <title>BinSu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        @property --spot-opacity {
            syntax: '<number>';
            initial-value: 0;
            inherits: false;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0718;
            --bg-card: rgba(16, 12, 40, 0.88);
            --text-primary: #f0ecff;
            --text-secondary: #c8c0e8;
            --text-muted: #7a729a;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.8);
            --card-radius: 2.2rem;
            --accent-1: #a78bfa;
            --accent-2: #f472b6;
            --accent-3: #6ee7b7;
            --accent-glow: rgba(167, 139, 250, 0.25);
            --gradient-main: linear-gradient(135deg, #a78bfa, #f472b6, #6ee7b7);
            --gradient-heart: linear-gradient(135deg, #a78bfa, #f472b6);
            --card-border-glow: rgba(167, 139, 250, 0.25);
            --card-border-width: 1.5px;
            --focus-ring: 0 0 0 3px rgba(167, 139, 250, 0.5);
            --transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-1) var(--bg-primary);
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--accent-1), var(--accent-2));
            border-radius: 10px;
            border: 2px solid var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(var(--accent-1), var(--accent-3));
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 130px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button { font-family: inherit; }
        a { color: inherit; }
        img { display: block; }

        :focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: 6px;
        }

        /* ==========================================================
           THANH TIẾN TRÌNH CUỘN
           ========================================================== */
        .scroll-progress {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            width: 0%;
            background: var(--gradient-main);
            z-index: 9999;
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 0.08s linear;
            pointer-events: none;
        }

        /* ==========================================================
           NÚT VỀ ĐẦU TRANG
           ========================================================== */
        .back-to-top {
            position: fixed;
            right: 20px;
            bottom: 100px;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--card-border-glow);
            color: var(--accent-1);
            cursor: pointer;
            z-index: 99;
            display: grid;
            place-items: center;
            opacity: 0;
            transform: translate3d(0, 20px, 0) scale(0.8);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px var(--shadow-color);
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            pointer-events: auto;
        }
        .back-to-top:hover {
            transform: translate3d(0, -3px, 0) scale(1.1);
            border-color: var(--accent-1);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .back-to-top:active { transform: translate3d(0, -1px, 0) scale(1.05); }
        .back-to-top i { font-size: 1.05rem; }

        /* ==========================================================
           NỀN AURORA
           ========================================================== */
        .aurora {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
            opacity: 0.55;
        }
        .aurora-blob {
            position: absolute;
            width: 65vmax; height: 65vmax;
            border-radius: 50%;
            filter: blur(90px);
            mix-blend-mode: screen;
            will-change: transform;
        }
        .aurora-blob:nth-child(1) {
            top: -25%; left: -25%;
            background: radial-gradient(circle, var(--accent-1), transparent 65%);
            animation: auroraMove1 22s ease-in-out infinite alternate;
        }
        .aurora-blob:nth-child(2) {
            top: 15%; right: -30%;
            background: radial-gradient(circle, var(--accent-2), transparent 65%);
            animation: auroraMove2 28s ease-in-out infinite alternate;
        }
        .aurora-blob:nth-child(3) {
            bottom: -25%; left: 30%;
            background: radial-gradient(circle, var(--accent-3), transparent 65%);
            animation: auroraMove3 25s ease-in-out infinite alternate;
        }
        @keyframes auroraMove1 {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(22vw, 14vh, 0) scale(1.25); }
        }
        @keyframes auroraMove2 {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-18vw, 18vh, 0) scale(1.15); }
        }
        @keyframes auroraMove3 {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(12vw, -22vh, 0) scale(1.2); }
        }

        .overlay-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(167, 139, 250, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(244, 114, 182, 0.04) 0%, transparent 45%),
                radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.65) 100%);
        }

        .noise-overlay {
            position: fixed; inset: 0; z-index: 1;
            pointer-events: none;
            opacity: 0.03;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .stars-container, .dust-container {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }

        .star {
            position: absolute; background: #fff; border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
            opacity: 0.3;
        }
        @keyframes twinkle {
            0%   { opacity: 0.12; transform: scale(0.7); }
            100% { opacity: 1;    transform: scale(1.3); }
        }

        .dust {
            position: absolute; background: rgba(255, 255, 255, 0.45); border-radius: 50%;
            animation: floatDust var(--duration, 25s) ease-in-out infinite alternate;
            filter: blur(1px);
        }
        @keyframes floatDust {
            0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 0.15; }
            100% { transform: translate3d(var(--dx, 20px), var(--dy, -20px), 0) scale(1.5); opacity: 0.55; }
        }

        .cursor-glow {
            position: fixed;
            width: 320px; height: 320px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: radial-gradient(circle,
                rgba(167, 139, 250, 0.14),
                rgba(167, 139, 250, 0.05) 40%,
                transparent 65%);
            mix-blend-mode: screen;
            will-change: transform;
        }
        @media (pointer: fine) {
            body:hover .cursor-glow { opacity: 1; }
        }

        /* ==========================================================
           MẶT TRĂNG — PEARL MOON (ngọc trai, 3 tầng halo)
           ========================================================== */
        .celestial-container {
            position: fixed; top: 70px; right: 40px; z-index: 2;
            pointer-events: none; transition: transform 0.5s ease;
        }

        .moon {
            width: 84px; height: 84px; border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 32% 26%,
                    #ffffff 0%,
                    #fdfcff 8%,
                    #f3effb 20%,
                    #e6dff4 38%,
                    #d0c8e8 55%,
                    #b0a8d0 72%,
                    #8e86b8 88%,
                    #726ba0 100%);
            box-shadow:
                0 0 24px rgba(220, 215, 250, 0.5),
                0 0 55px rgba(200, 195, 240, 0.28),
                0 0 110px rgba(180, 175, 225, 0.13),
                0 0 180px rgba(160, 155, 210, 0.06),
                inset -10px -8px 22px rgba(70, 65, 115, 0.42),
                inset 6px 5px 14px rgba(255, 255, 255, 0.55),
                inset -2px -2px 4px rgba(90, 85, 130, 0.2);
        }
        .moon::before {
            content: '';
            position: absolute;
            inset: -26px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(210, 205, 245, 0.16) 0%,
                rgba(180, 175, 220, 0.06) 45%,
                transparent 68%);
            animation: moonHalo 6s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes moonHalo {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.08); }
        }
        .moon .crater {
            position: absolute;
            border-radius: 50%;
            background:
                radial-gradient(circle at 40% 38%,
                    rgba(130, 120, 170, 0.45),
                    rgba(105, 95, 145, 0.30) 45%,
                    rgba(85, 75, 125, 0.18) 75%,
                    rgba(70, 60, 105, 0.10) 100%);
            box-shadow:
                inset -1.5px -1.5px 3px rgba(60, 50, 90, 0.35),
                inset 1px 1px 2px rgba(255, 255, 255, 0.18);
        }
        .moon .crater:nth-child(1) { width: 20px; height: 20px; top: 14px; left: 16px; }
        .moon .crater:nth-child(2) { width: 12px; height: 12px; top: 43px; left: 47px; }
        .moon .crater:nth-child(3) { width: 22px; height: 22px; top: 48px; left:  8px; }
        .moon .crater:nth-child(4) { width:  9px; height:  9px; top: 26px; left: 58px; }
        .moon .crater:nth-child(5) { width: 14px; height: 14px; top:  7px; left: 41px; }
        .moon .crater:nth-child(6) { width:  7px; height:  7px; top: 63px; left: 30px; }

        /* ==========================================================
           MÀN HÌNH ENTER
           ========================================================== */
        #enter-screen {
            position: fixed; inset: 0; z-index: 99999;
            background: var(--bg-primary);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden;
            transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
        }
        #enter-screen.hidden {
            opacity: 0;
            transform: scale(1.08);
            filter: blur(24px);
            pointer-events: none;
        }
        #enter-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .enter-content {
            position: relative; z-index: 1; text-align: center;
            display: flex; flex-direction: column; align-items: center;
            gap: 1.8rem; padding: 1rem;
        }
        .enter-logo {
            width: 130px; height: 130px; border-radius: 50%;
            background: var(--gradient-heart); padding: 5px;
            animation: enterPulse 3s ease-in-out infinite;
            box-shadow: 0 0 80px var(--accent-glow);
        }
        .enter-logo img {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; background: var(--bg-primary);
        }
        @keyframes enterPulse {
            0%,100% { transform: scale(1);    box-shadow: 0 0 80px  var(--accent-glow); }
            50%     { transform: scale(1.04); box-shadow: 0 0 120px var(--accent-glow); }
        }
        .enter-title {
            font-size: 3.2rem; font-weight: 900; letter-spacing: 4px;
            background: var(--gradient-main);
            background-size: 200% 200%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0; transform: translateY(20px);
            animation:
                enterFade 0.8s ease forwards 0.4s,
                titleShimmer 3.5s ease-in-out infinite 1.2s;
        }
        @keyframes enterFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes titleShimmer {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .enter-key {
            display: inline-flex; align-items: center; gap: 0.8rem;
            padding: 0.8rem 2.6rem;
            border: 2px solid rgba(167,139,250,0.35);
            border-radius: 60px;
            font-size: 1.1rem; font-weight: 700; letter-spacing: 3px;
            color: var(--accent-1);
            background: rgba(167,139,250,0.05);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: var(--transition);
            animation: enterPulseKey 2.2s ease-in-out infinite;
        }
        .enter-key:hover {
            background: rgba(167,139,250,0.14);
            border-color: var(--accent-1);
            transform: scale(1.05);
            box-shadow: 0 0 60px var(--accent-glow);
        }
        @keyframes enterPulseKey {
            0%,100% { box-shadow: 0 0 20px rgba(167,139,250,0.05); }
            50%     { box-shadow: 0 0 50px rgba(167,139,250,0.15); }
        }
        .enter-key i { animation: enterArrow 1s ease-in-out infinite alternate; }
        @keyframes enterArrow {
            0%   { transform: translate3d(-6px, 0, 0); opacity: 0.5; }
            100% { transform: translate3d(10px, 0, 0); opacity: 1;   }
        }
        .enter-sub {
            font-size: 0.8rem; color: var(--text-muted);
            letter-spacing: 6px; font-weight: 300;
            opacity: 0; transform: translateY(10px);
            animation: enterFade 0.8s ease forwards 0.8s;
        }

        /* ==========================================================
           WRAPPER CHÍNH
           ========================================================== */
        .main-wrapper {
            position: relative; z-index: 2;
            max-width: 820px; margin: 0 auto;
            padding: 2.5rem 1.2rem 2rem;
            display: flex; flex-direction: column; gap: 1.6rem;
            opacity: 0; transform: translate3d(0, 30px, 0);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        .main-wrapper.visible { opacity: 1; transform: translate3d(0, 0, 0); }

        .reveal {
            opacity: 0;
            transform: translate3d(0, 34px, 0);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }
        .reveal:nth-child(1).visible { transition-delay: 0.05s; }
        .reveal:nth-child(2).visible { transition-delay: 0.15s; }
        .reveal:nth-child(3).visible { transition-delay: 0.25s; }
        .reveal:nth-child(4).visible { transition-delay: 0.35s; }
        .reveal:nth-child(5).visible { transition-delay: 0.45s; }

        /* ==========================================================
           THẺ
           ========================================================== */
        .card {
            --rx: 0deg;
            --ry: 0deg;
            --ty: 0px;
            --mx: 50%;
            --my: 50%;
            --spot-opacity: 0;

            background-color: var(--bg-card);
            background-image: radial-gradient(
                340px circle at var(--mx) var(--my),
                rgba(167, 139, 250, var(--spot-opacity)),
                transparent 70%
            );
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: var(--card-radius);
            padding: 1.8rem 1.8rem 1.5rem;
            border: var(--card-border-width) solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow-color);
            transition:
                transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.35s ease,
                border-color 0.35s ease,
                background-color 0.5s ease,
                --spot-opacity 0.45s ease;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            transform: perspective(1200px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty));
            transform-style: preserve-3d;
            contain: layout style;
        }

        .card::before {
            content: ''; position: absolute; inset: -3px;
            border-radius: calc(var(--card-radius) + 2px);
            background: var(--gradient-main);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 8s ease infinite;
            opacity: 0.22;
        }
        @keyframes borderGlow {
            0%,100% { background-position: 0% 50%; }
            50%     { background-position: 100% 50%; }
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: calc(var(--card-radius) - 6px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.4s ease;
            background:
                linear-gradient(90deg,   var(--accent-1), transparent) top    left  / 28px 1.5px no-repeat,
                linear-gradient(180deg,  var(--accent-1), transparent) top    left  / 1.5px 28px no-repeat,
                linear-gradient(270deg,  var(--accent-2), transparent) top    right / 28px 1.5px no-repeat,
                linear-gradient(180deg,  var(--accent-2), transparent) top    right / 1.5px 28px no-repeat,
                linear-gradient(90deg,   var(--accent-2), transparent) bottom left  / 28px 1.5px no-repeat,
                linear-gradient(0deg,    var(--accent-2), transparent) bottom left  / 1.5px 28px no-repeat,
                linear-gradient(270deg,  var(--accent-1), transparent) bottom right / 28px 1.5px no-repeat,
                linear-gradient(0deg,    var(--accent-1), transparent) bottom right / 1.5px 28px no-repeat;
        }
        .card:hover::after { opacity: 1; }
        .card:hover {
            --ty: -4px;
            --spot-opacity: 0.18;
            box-shadow: 0 30px 80px var(--shadow-color), 0 0 40px var(--card-border-glow);
            border-color: var(--card-border-glow);
        }

        /* ==========================================================
           HỒ SƠ — TRANG TRÍ NÂNG CAO
           ========================================================== */
        .card-profile {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 2.4rem 1.6rem 1.6rem;
        }

        /* Đốm sáng bay quanh avatar */
        .profile-sparkles {
            position: absolute;
            inset: -22px;
            pointer-events: none;
            z-index: 0;
        }
        .profile-sparkles span {
            position: absolute;
            width: 5px; height: 5px;
            border-radius: 50%;
            animation: sparkleFloat 4.5s ease-in-out infinite;
        }
        .profile-sparkles span:nth-child(1) {
            top: 8%; left: 2%;
            background: var(--accent-1);
            box-shadow: 0 0 12px var(--accent-1), 0 0 20px var(--accent-1);
            animation-delay: 0s;
        }
        .profile-sparkles span:nth-child(2) {
            top: 50%; right: 0%;
            background: var(--accent-2);
            box-shadow: 0 0 12px var(--accent-2), 0 0 20px var(--accent-2);
            animation-delay: 1.1s;
        }
        .profile-sparkles span:nth-child(3) {
            bottom: 10%; left: 8%;
            background: var(--accent-3);
            box-shadow: 0 0 12px var(--accent-3), 0 0 20px var(--accent-3);
            animation-delay: 2.2s;
        }
        .profile-sparkles span:nth-child(4) {
            bottom: 30%; right: 5%;
            background: var(--accent-1);
            box-shadow: 0 0 12px var(--accent-1), 0 0 20px var(--accent-1);
            animation-delay: 3.3s;
        }
        @keyframes sparkleFloat {
            0%, 100% { opacity: 0.35; transform: translate3d(0, 0, 0) scale(0.6); }
            50%      { opacity: 1;    transform: translate3d(0, -8px, 0) scale(1.15); }
        }

        .avatar-wrap {
            position: relative;
            margin-bottom: 0.6rem;
            isolation: isolate;
        }
        /* Vòng orbit */
        .avatar-wrap::before {
            content: '';
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--accent-1) 70deg,
                var(--accent-2) 150deg,
                var(--accent-3) 230deg,
                transparent 320deg
            );
            animation: avatarOrbit 7s linear infinite;
            -webkit-mask: radial-gradient(circle closest-side at center,
                transparent calc(100% - 2.5px),
                #000 calc(100% - 1px),
                #000 100%);
            mask: radial-gradient(circle closest-side at center,
                transparent calc(100% - 2.5px),
                #000 calc(100% - 1px),
                #000 100%);
            z-index: -1;
            pointer-events: none;
            opacity: 0.9;
        }
        /* Glow aura sau avatar */
        .avatar-wrap::after {
            content: '';
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
            z-index: -2;
            pointer-events: none;
            animation: avatarAura 3.5s ease-in-out infinite;
        }
        @keyframes avatarOrbit { to { transform: rotate(360deg); } }
        @keyframes avatarAura {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50%      { opacity: 0.85; transform: scale(1.08); }
        }

        .avatar-burst {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent-1);
            pointer-events: none;
            z-index: 0;
            animation: avatarBurst 1s ease-out forwards;
        }
        @keyframes avatarBurst {
            0%   { transform: scale(1);   opacity: 0.9; }
            100% { transform: scale(2.4); opacity: 0;   }
        }

        .avatar {
            --av-rx: 0deg;
            --av-ry: 0deg;
            --av-scale: 1;
            width: 110px; height: 110px; border-radius: 50%;
            background: var(--gradient-heart); padding: 5px;
            box-shadow: 0 8px 40px var(--accent-glow);
            cursor: pointer;
            transform: perspective(600px) rotateX(var(--av-rx)) rotateY(var(--av-ry)) scale(var(--av-scale));
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            position: relative;
            z-index: 1;
        }
        .avatar:hover { --av-scale: 1.05; }
        .avatar.pulse { animation: avatarPulseAnim 0.55s ease; }
        @keyframes avatarPulseAnim {
            0%,100% { transform: perspective(600px) rotateX(var(--av-rx)) rotateY(var(--av-ry)) scale(var(--av-scale)); }
            30%     { transform: perspective(600px) rotateX(var(--av-rx)) rotateY(var(--av-ry)) scale(calc(var(--av-scale) * 0.9)); }
            70%     { transform: perspective(600px) rotateX(var(--av-rx)) rotateY(var(--av-ry)) scale(calc(var(--av-scale) * 1.1)); }
        }
        .avatar img {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; background: var(--bg-primary);
        }
        .status-ring {
            position: absolute; bottom: 4px; right: 4px;
            width: 18px; height: 18px; background: var(--accent-3);
            border-radius: 50%; border: 3px solid var(--bg-primary);
            box-shadow: 0 0 30px rgba(110,231,183,0.5);
            animation: ringPulse 2s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes ringPulse {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.2); }
        }

        /* ==========================================================
           HIỆU ỨNG CHỮ — TÊN VỚI PULSE GLOW 3 MÀU
           ========================================================== */
        .name-group h1 {
            font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px;
            transition: color 0.4s ease, text-shadow 0.4s ease;
            color: #ffffff;
            animation: nameGlow 4.5s ease-in-out infinite;
        }
        @keyframes nameGlow {
            0%, 100% {
                text-shadow:
                    0 0 18px rgba(167, 139, 250, 0.45),
                    0 0 38px rgba(244, 114, 182, 0.25),
                    0 0 60px rgba(110, 231, 183, 0.15);
            }
            50% {
                text-shadow:
                    0 0 28px rgba(167, 139, 250, 0.75),
                    0 0 58px rgba(244, 114, 182, 0.45),
                    0 0 90px rgba(110, 231, 183, 0.28);
            }
        }

        #profile-name span {
            display: inline-block;
            opacity: 0;
            transform: translate3d(0, 28px, 0) rotateX(-80deg);
            transform-origin: center bottom;
            transition:
                opacity 0.55s ease,
                transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #profile-name.revealed span { opacity: 1; transform: translate3d(0, 0, 0) rotateX(0); }
        #profile-name span:nth-child(1) { transition-delay: 0.05s; }
        #profile-name span:nth-child(2) { transition-delay: 0.12s; }
        #profile-name span:nth-child(3) { transition-delay: 0.19s; }
        #profile-name span:nth-child(4) { transition-delay: 0.26s; }
        #profile-name span:nth-child(5) { transition-delay: 0.33s; }
        #profile-name span:nth-child(6) { transition-delay: 0.40s; }

        .name-group .handle {
            font-size: 0.9rem; color: var(--text-secondary); letter-spacing: 0.5px;
            transition: color 0.3s ease, letter-spacing 0.3s ease;
        }
        .name-group .handle i { color: var(--accent-1); margin-right: 4px; }
        .name-group:hover .handle {
            color: var(--accent-1);
            letter-spacing: 0.8px;
        }

        /* Divider dưới tên */
        .name-divider {
            width: 60px; height: 2px;
            margin: 0.55rem auto 0.4rem;
            background: var(--gradient-main);
            border-radius: 2px;
            position: relative;
            animation: dividerPulse 3.5s ease-in-out infinite;
        }
        .name-divider::before,
        .name-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--accent-1);
            transform: translateY(-50%);
            box-shadow: 0 0 8px var(--accent-1);
        }
        .name-divider::before { left: -8px; }
        .name-divider::after  { right: -8px; }
        @keyframes dividerPulse {
            0%, 100% { width: 60px; opacity: 0.7; }
            50%      { width: 90px; opacity: 1;   }
        }

        .bio-text {
            margin: 0.4rem 0 0.8rem; font-size: 0.85rem;
            color: var(--text-secondary); line-height: 1.7;
        }
        .bio-text i { color: var(--accent-2); margin: 0 3px; }

        .typed-cursor {
            display: inline-block;
            color: var(--accent-1);
            font-weight: 300;
            animation: cursorBlink 1s step-end infinite;
            margin-left: 1px;
            text-shadow: 0 0 8px var(--accent-1);
        }
        @keyframes cursorBlink { 50% { opacity: 0; } }
        .typed-cursor.done { display: none; }

        /* ==========================================================
           MẠNG XÃ HỘI
           ========================================================== */
        .social-under {
            display: flex; justify-content: center; gap: 0.8rem;
            margin: 0.2rem 0 0.4rem; flex-wrap: wrap;
        }
        .social-under a {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary); font-size: 1.3rem;
            transition: var(--transition); text-decoration: none;
            position: relative;
        }
        .social-under a::after {
            content: ''; position: absolute; inset: -2px;
            border-radius: 50%; background: var(--gradient-main);
            opacity: 0; z-index: -1; transition: opacity 0.3s;
            filter: blur(6px);
        }
        .social-under a:hover::after { opacity: 0.4; }
        .social-under a::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translate3d(-50%, 6px, 0);
            padding: 0.32rem 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 5;
            box-shadow: 0 6px 20px var(--shadow-color);
        }
        .social-under a:hover::before,
        .social-under a:focus-visible::before {
            opacity: 1;
            transform: translate3d(-50%, 0, 0);
        }
        .social-under a:hover {
            transform: translate3d(0, -4px, 0) scale(1.10);
            background: rgba(255,255,255,0.08);
            border-color: var(--accent-1);
            box-shadow: 0 12px 40px var(--accent-glow);
            color: #fff;
        }
        .social-under a:hover i { animation: iconWiggle 0.5s ease; }
        @keyframes iconWiggle {
            0%,100% { transform: rotate(0) scale(1); }
            30%     { transform: rotate(-12deg) scale(1.15); }
            70%     { transform: rotate(10deg) scale(1.1); }
        }
        .social-under a.discord:hover   { background: #5865f2; border-color: #5865f2; }
        .social-under a.facebook:hover  { background: #1877f2; border-color: #1877f2; }
        .social-under a.tiktok:hover    { background: #000;    border-color: #fff;    }
        .social-under a.instagram:hover { background: #e4405f; border-color: #e4405f; }
        .social-under a.spotify:hover   { background: #1db954; border-color: #1db954; }

        /* ==========================================================
           DẢI CHỮ CHẠY — CHỈ BinSu · Kdy
           ========================================================== */
        .marquee {
            overflow: hidden;
            padding: 0.5rem 0;
            -webkit-mask: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
            mask: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
            opacity: 0.85;
        }
        .marquee-track {
            display: inline-flex;
            gap: 2.5rem;
            width: max-content;
            white-space: nowrap;
            animation: marqueeScroll 22s linear infinite;
            font-size: 0.78rem;
            letter-spacing: 0.42em;
            font-weight: 700;
            text-transform: uppercase;
            padding-right: 2.5rem;
        }
        .marquee-track span {
            flex-shrink: 0;
            background: var(--gradient-main);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: marqueeTextShimmer 6s ease-in-out infinite;
        }
        .marquee-track span:nth-child(odd)  { animation-delay: 0s; }
        .marquee-track span:nth-child(even) { animation-delay: 3s; }
        @keyframes marqueeTextShimmer {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        .marquee:hover .marquee-track { animation-play-state: paused; }
        @keyframes marqueeScroll {
            to { transform: translate3d(-50%, 0, 0); }
        }

        /* ==========================================================
           BÀI HÁT
           ========================================================== */
        .info-card .intro {
            font-size: 0.9rem; color: var(--text-secondary);
            line-height: 1.8; margin-bottom: 1.2rem; padding: 0 0.2rem;
        }
        .info-card .intro i { color: var(--accent-2); margin: 0 4px; }

        .deco-songs {
            display: flex; flex-wrap: wrap; gap: 0.8rem;
            justify-content: center;
        }
        .deco-song {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.4rem 0.8rem 0.4rem 0.4rem;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
            flex: 0 1 auto;
            min-width: 150px;
            text-align: left;
            color: inherit;
            font: inherit;
            position: relative;
        }
        .deco-song:hover {
            background: rgba(167,139,250,0.06);
            transform: scale(1.02);
        }
        .deco-song.active {
            border-color: var(--accent-1);
            background: rgba(167,139,250,0.08);
            box-shadow: 0 0 24px rgba(167,139,250,0.15);
        }
        .deco-song.active::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            border: 1.5px solid var(--accent-1);
            opacity: 0.6;
            animation: activeGlow 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes activeGlow {
            0%, 100% { opacity: 0.4; box-shadow: 0 0 10px var(--accent-glow); }
            50%      { opacity: 0.9; box-shadow: 0 0 25px var(--accent-glow); }
        }
        .deco-song .song-img {
            width: 44px; height: 44px; border-radius: 12px;
            overflow: hidden; flex-shrink: 0;
            background: var(--gradient-heart);
        }
        .deco-song .song-img img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .deco-song .song-info .name {
            font-weight: 600; font-size: 0.8rem; color: var(--text-primary);
            max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            transition: color 0.3s ease;
        }
        .deco-song:hover .song-info .name {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .deco-song .song-info .artist {
            font-size: 0.65rem; color: var(--text-muted);
        }
        .deco-song.active.playing .song-info .name::after {
            content: ' ♪'; color: var(--accent-1);
            -webkit-text-fill-color: var(--accent-1);
            animation: nowPlaying 1.2s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes nowPlaying {
            0%,100% { transform: translateY(0);   opacity: 0.6; }
            50%     { transform: translateY(-2px); opacity: 1;   }
        }

        /* ==========================================================
           TIÊU ĐỀ MỤC — GRADIENT SHIMMER
           ========================================================== */
        .section-title {
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-muted); margin-bottom: 0.6rem;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .section-title i {
            color: var(--accent-1);
            animation: titleIconFloat 3s ease-in-out infinite;
        }
        .section-title .title-text {
            background: var(--gradient-main);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmerText 6s ease-in-out infinite;
            font-weight: 700;
        }
        @keyframes titleShimmerText {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        @keyframes titleIconFloat {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50%      { transform: translate3d(0, -2px, 0); }
        }
        .section-title .rule {
            flex: 1; height: 1px; background: var(--border-color); margin: 0 0.4rem;
        }

        /* ==========================================================
           THƯ VIỆN ẢNH
           ========================================================== */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem;
        }
        .gallery-item {
            border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;
            background: var(--gradient-heart);
            position: relative; cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            border: none; padding: 0;
        }
        .gallery-item:hover {
            transform: translate3d(0, -4px, 0) scale(1.04);
            box-shadow: 0 12px 40px var(--accent-glow);
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gallery-item:hover img { transform: scale(1.10); }
        .gallery-item .overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
            font-size: 1.4rem; color: #fff;
        }
        .gallery-item:hover .overlay,
        .gallery-item:focus-visible .overlay { opacity: 1; }

        /* ==========================================================
           LIGHTBOX
           ========================================================== */
        .lightbox-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.45s ease, visibility 0.45s ease;
            cursor: pointer; padding: 2rem;
        }
        .lightbox-overlay.active { opacity: 1; visibility: visible; }
        .lightbox-content {
            position: relative; max-width: 90vw; max-height: 85vh;
            cursor: default;
            transform: scale(0.85) translateY(30px);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8);
        }
        .lightbox-overlay.active .lightbox-content { transform: scale(1) translateY(0); }
        .lightbox-content img {
            display: block;
            max-width: 90vw; max-height: 85vh;
            object-fit: contain; border-radius: 20px;
        }
        .lightbox-close {
            position: absolute; top: 16px; right: 24px;
            width: 48px; height: 48px; border-radius: 50%;
            display: grid; place-items: center;
            font-size: 2.2rem; line-height: 1; color: #fff;
            cursor: pointer; background: rgba(0,0,0,0.35);
            transition: transform 0.3s ease, background 0.3s ease;
            border: none;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.15); transform: rotate(90deg) scale(1.05); }
        .lightbox-counter {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 0.8rem; letter-spacing: 2px;
            background: rgba(0,0,0,0.4); padding: 0.3rem 1.2rem;
            border-radius: 30px; backdrop-filter: blur(4px);
        }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 52px; height: 52px; border-radius: 50%;
            display: grid; place-items: center;
            font-size: 1.8rem; line-height: 1; color: rgba(255,255,255,0.85);
            cursor: pointer; border: none;
            background: rgba(0,0,0,0.35);
            transition: background 0.3s ease, transform 0.3s ease;
            user-select: none;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); transform: translateY(-50%) scale(1.06); }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }

        /* ==========================================================
           CHÂN TRANG
           ========================================================== */
        .footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.6rem; color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 0.8rem; flex-wrap: wrap; gap: 0.4rem;
        }
        .footer .brand {
            display: inline-flex; align-items: center; gap: 0.35rem;
            background: var(--gradient-main);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            animation: titleShimmerText 8s ease-in-out infinite;
        }
        .footer .brand i { color: var(--accent-1); -webkit-text-fill-color: var(--accent-1); }
        .clock {
            font-variant-numeric: tabular-nums;
            background: rgba(255,255,255,0.02);
            padding: 0.15rem 0.6rem; border-radius: 30px;
            border: 1px solid var(--border-color);
            display: inline-flex; align-items: center; gap: 0.35rem;
        }

        /* ==========================================================
           PLAYER CỐ ĐỊNH
           ========================================================== */
        .fixed-player {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 1.5px solid var(--border-color);
            padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -10px 50px var(--shadow-color);
        }
        .fixed-player::before {
            content: ''; position: absolute; top: -1.5px; left: 8%; right: 8%;
            height: 1.5px; background: var(--gradient-main);
            border-radius: 10px; opacity: 0.5;
            animation: playerGlow 3s ease-in-out infinite;
        }
        @keyframes playerGlow {
            0%,100% { opacity: 0.2; transform: scaleX(0.8); }
            50%     { opacity: 0.75; transform: scaleX(1);  }
        }

        .player-inner {
            display: grid;
            grid-template-columns: auto auto minmax(0, 1fr) auto;
            grid-template-areas:
                "viz cover info controls"
                "progress progress progress progress";
            gap: 0.4rem 0.8rem;
            align-items: center;
            max-width: 820px;
            margin: 0 auto;
        }
        .music-visualizer { grid-area: viz; }
        .player-cover      { grid-area: cover; }
        .player-info       { grid-area: info; }
        .player-controls   { grid-area: controls; }
        .progress-wrap     { grid-area: progress; }

        .player-cover {
            width: 46px; height: 46px; border-radius: 14px;
            background: var(--gradient-heart);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
            position: relative; overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }
        .player-cover:hover { transform: scale(1.05); }
        .player-cover.playing { animation: coverPulse 2.5s ease-in-out infinite; }
        @keyframes coverPulse {
            0%, 100% { box-shadow: 0 4px 20px var(--accent-glow); }
            50%      { box-shadow: 0 4px 30px var(--accent-glow), 0 0 42px var(--accent-glow); }
        }
        .player-cover .cover-img { width: 100%; height: 100%; object-fit: cover; }
        .player-cover .cover-icon {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.22);
        }
        .player-cover.buffering::after {
            content: '';
            position: absolute; inset: 3px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-1);
            animation: coverSpin 0.9s linear infinite;
        }
        @keyframes coverSpin { to { transform: rotate(360deg); } }

        .player-info { min-width: 0; }
        .player-info .track {
            font-weight: 600; font-size: 0.85rem; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .player-info .artist {
            font-size: 0.7rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .player-controls {
            display: flex; align-items: center; gap: 0.2rem; flex-shrink: 0;
        }
        .player-controls .time {
            font-size: 0.6rem; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 62px; text-align: right;
        }
        .player-controls button {
            background: none; border: none; color: var(--text-primary);
            font-size: 1.15rem; cursor: pointer;
            transition: transform 0.2s ease, color 0.2s ease;
            line-height: 1; padding: 4px 6px; border-radius: 50%;
        }
        .player-controls button:hover { color: var(--accent-1); transform: scale(1.12); }
        #playBtn {
            font-size: 1.45rem; padding: 0 6px;
            width: 38px; height: 38px; border-radius: 50%;
            display: grid; place-items: center;
            position: relative;
        }
        #playBtn.playing::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid var(--accent-1);
            opacity: 0;
            animation: playBtnPulse 1.8s ease-out infinite;
            pointer-events: none;
        }
        @keyframes playBtnPulse {
            0%   { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 0;   }
        }
        .mute-btn {
            font-size: 0.95rem !important;
            opacity: 0.65;
            padding: 4px !important;
        }
        .mute-btn:hover { opacity: 1; }
        .mute-btn.muted { color: var(--accent-2); opacity: 1; }

        /* ==========================================================
           THANH TIẾN TRÌNH PHÁT NHẠC
           ========================================================== */
        .progress-wrap {
            height: 4px; background: rgba(167,139,250,0.10);
            border-radius: 10px; cursor: pointer; position: relative;
            transition: height 0.2s ease;
            touch-action: none;
            overflow: hidden;
        }
        .progress-wrap:hover,
        .progress-wrap.dragging { height: 6px; }
        .progress-buffered {
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 0%;
            background: rgba(167,139,250,0.25);
            border-radius: 10px;
            transition: width 0.3s ease;
            pointer-events: none;
        }
        .progress-bar {
            position: relative;
            z-index: 1;
            height: 100%; width: 0%;
            background: var(--gradient-heart); border-radius: 10px;
            transition: width 0.1s linear;
            overflow: hidden;
        }
        .progress-bar::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            animation: progressShine 2.2s linear infinite;
            will-change: transform;
        }
        @keyframes progressShine {
            0%   { transform: translate3d(-100%, 0, 0); }
            100% { transform: translate3d(100%, 0, 0); }
        }
        .progress-bar::after {
            content: ''; position: absolute; right: -5px; top: 50%;
            transform: translateY(-50%);
            width: 12px; height: 12px; background: var(--accent-1);
            border-radius: 50%; box-shadow: 0 0 30px var(--accent-glow);
            opacity: 0; transition: opacity 0.2s ease;
        }
        .progress-wrap:hover .progress-bar::after,
        .progress-wrap.dragging .progress-bar::after { opacity: 1; }

        /* ==========================================================
           VISUALIZER
           ========================================================== */
        .music-visualizer {
            display: flex; align-items: center; gap: 2px;
            height: 26px; flex-shrink: 0;
        }
        .music-visualizer .bar {
            width: 3px; height: 30%;
            background: linear-gradient(to top, var(--accent-1), var(--accent-2));
            border-radius: 4px;
            opacity: 0.35;
            transition: height 0.08s linear, opacity 0.2s ease;
        }
        .music-visualizer .bar.active { opacity: 1; }
        @media (max-width: 560px) {
            .music-visualizer { height: 20px; gap: 1.5px; }
            .music-visualizer .bar { width: 2px; }
        }

        /* ==========================================================
           NỐT NHẠC BAY
           ========================================================== */
        .music-note {
            position: fixed;
            pointer-events: none;
            z-index: 49;
            font-family: serif;
            font-weight: 700;
            filter: drop-shadow(0 0 8px currentColor);
            animation: noteRise 3s ease-out forwards;
            will-change: transform, opacity;
        }
        @keyframes noteRise {
            0%   { opacity: 0;   transform: translate3d(0, 0, 0) scale(0.4) rotate(0deg); }
            15%  { opacity: 0.9; transform: translate3d(0, -8px, 0) scale(1) rotate(6deg); }
            100% { opacity: 0;   transform: translate3d(var(--dx, 20px), -170px, 0) scale(0.7) rotate(-25deg); }
        }

        /* ==========================================================
           HIỆU ỨNG CLICK
           ========================================================== */
        .click-effect-container {
            position: fixed; inset: 0; z-index: 9998;
            pointer-events: none; overflow: hidden;
        }
        .click-ripple {
            position: absolute; border-radius: 50%;
            border: 2px solid var(--accent-1);
            animation: rippleAnim 0.9s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            0%   { transform: scale(0); opacity: 0.85; }
            100% { transform: scale(4); opacity: 0;    }
        }
        .click-sparkle {
            position: absolute; border-radius: 50%;
            pointer-events: none;
            animation: sparkleFly 0.8s ease-out forwards;
        }
        @keyframes sparkleFly {
            0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
            100% { transform: translate3d(var(--tx), var(--ty), 0) scale(0); opacity: 0; }
        }

        #customToast {
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        /* ==========================================================
           RESPONSIVE
           ========================================================== */
        @media (max-width: 650px) {
            body { padding-bottom: 150px; }
            .main-wrapper { padding: 1.2rem 0.8rem 1.5rem; gap: 1.2rem; }
            .card { padding: 1.3rem 1.1rem; border-radius: 1.8rem; }
            .card::after { inset: 5px; border-radius: calc(var(--card-radius) - 5px); }
            .avatar { width: 90px; height: 90px; }
            .name-group h1 { font-size: 2rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .enter-title { font-size: 2.4rem; letter-spacing: 3px; }
            .enter-logo { width: 105px; height: 105px; }
            .enter-key { font-size: 0.95rem; padding: 0.65rem 1.8rem; }
            .deco-song { min-width: 130px; }
            .celestial-container { top: 70px; right: 14px; transform: scale(0.72); }
            .back-to-top {
                right: 14px;
                bottom: calc(160px + env(safe-area-inset-bottom, 0px));
                width: 40px; height: 40px;
            }
            .lightbox-close { top: 10px; right: 12px; width: 42px; height: 42px; font-size: 1.8rem; }
            .lightbox-nav { width: 44px; height: 44px; font-size: 1.4rem; }
            .lightbox-nav.prev { left: 8px; }
            .lightbox-nav.next { right: 8px; }
            .lightbox-overlay { padding: 1rem; }
            .avatar-wrap::before { inset: -7px; }
            .avatar-wrap::after  { inset: -18px; }
            .profile-sparkles { inset: -16px; }
        }

        @media (max-width: 560px) {
            .player-inner {
                grid-template-columns: auto auto minmax(0, 1fr);
                grid-template-areas:
                    "viz cover info"
                    "controls controls controls"
                    "progress progress progress";
                gap: 0.35rem 0.6rem;
            }
            .player-controls { justify-content: center; }
        }

        @media (max-width: 400px) {

            .social-under a::before { font-size: 0.6rem; }

        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

    <script>
    (function () {
        'use strict';

        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const hasFinePointer = window.matchMedia('(pointer: fine)').matches;

        let pageVisible = !document.hidden;
        document.addEventListener('visibilitychange', () => {
            pageVisible = !document.hidden;
        });

        const FALLBACKS = {
            avatar:  makeSvgFallback('B', '#a78bfa', '#f472b6'),
            song:    makeSvgFallback('♪', '#a78bfa', '#6ee7b7'),
            gallery: makeSvgFallback('◈', '#a78bfa', '#f472b6'),
        };

        function makeSvgFallback(glyph, c1, c2) {
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
                '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
                '<stop offset="0" stop-color="' + c1 + '"/>' +
                '<stop offset="1" stop-color="' + c2 + '"/>' +
                '</linearGradient></defs>' +
                '<rect width="100" height="100" fill="url(#g)"/>' +
                '<text x="50" y="56" font-size="42" text-anchor="middle" fill="rgba(255,255,255,0.9)" ' +
                'font-family="sans-serif" font-weight="700" dominant-baseline="middle">' + glyph + '</text>' +
                '</svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function attachImageFallback(img) {
            if (!img) return;
            const type = img.dataset.fallback;
            if (!type || !FALLBACKS[type]) return;
            img.addEventListener('error', function onErr() {
                img.removeEventListener('error', onErr);
                img.src = FALLBACKS[type];
            }, { once: true });
            if (img.complete && img.naturalWidth === 0) {
                img.src = FALLBACKS[type];
            }
        }

        /* ==========================================================
           TRÌNH PHÁT NHẠC
           KHÔNG đặt audio.crossOrigin — play() gọi ĐỒNG BỘ trong
           click ENTER để autoplay luôn được phép.
           ========================================================== */
        const Player = (function initPlayer() {
            const songList = [
                { name: 'Đừng làm trái tim anh đau(rmk)', artist: 'Obito', img: 'images/songs/song1.jpg', src: 'audio/song1.mp3' },
                { name: 'Một bài hát không vui mấy',      artist: 'T.R.I', img: 'images/songs/song2.jpg', src: 'audio/song2.mp3' },
                { name: 'Chỉ cần em muốn',                artist: 'NP2',   img: 'images/songs/song3.jpg', src: 'audio/song3.mp3' },
            ];

            const audio = new Audio();
            audio.preload = 'auto';

            let isPlaying       = false;
            let currentIndex    = 0;
            let visualizerRaf   = null;
            let errorShown      = false;
            let isMuted         = false;

            const playBtn      = $('#playBtn');
            const playIcon     = playBtn.querySelector('i');
            const prevBtn      = $('#prevBtn');
            const nextBtn      = $('#nextBtn');
            const muteBtn      = $('#muteBtn');
            const muteIcon     = muteBtn.querySelector('i');
            const trackName    = $('#trackName');
            const artistName   = $('#artistName');
            const timeDisplay  = $('#timeDisplay');
            const progressBar  = $('#progressBar');
            const progressBuf  = $('#progressBuffered');
            const progressWrap = $('#progressWrap');
            const coverImg     = $('#coverImg');
            const coverIcon    = $('.player-cover .cover-icon');
            const coverEl      = $('#playerCover');
            const playerEl     = $('#fixedPlayer');
            const bars         = $$('.music-visualizer .bar');
            const decoSongs    = $$('.deco-song');

            function startVisualizer() {
                bars.forEach(b => b.classList.add('active'));
                stopVisualizerTimer();
                if (prefersReduced) {
                    bars.forEach((b, i) => { b.style.height = (28 + (i % 3) * 18) + '%'; });
                    return;
                }
                const start = performance.now();
                const tick = (now) => {
                    if (!pageVisible) {
                        visualizerRaf = requestAnimationFrame(tick);
                        return;
                    }
                    const t = (now - start) / 1000;
                    bars.forEach((b, i) => {
                        const h =
                            30 +
                            Math.sin(t * 2.4 + i * 0.55) * 24 +
                            Math.sin(t * 4.7 + i * 0.85) * 14 +
                            Math.sin(t * 8.1 + i * 1.30) * 8 +
                            (Math.random() - 0.5) * 5;
                        b.style.height = Math.max(6, Math.min(100, h)) + '%';
                    });
                    visualizerRaf = requestAnimationFrame(tick);
                };
                visualizerRaf = requestAnimationFrame(tick);
            }
            function stopVisualizerTimer() {
                if (visualizerRaf) { cancelAnimationFrame(visualizerRaf); visualizerRaf = null; }
            }
            function stopVisualizer() {
                stopVisualizerTimer();
                bars.forEach(b => { b.classList.remove('active'); b.style.height = ''; });
            }

            function fmtTime(sec) {
                if (!isFinite(sec) || sec < 0) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }
            function updateTime() {
                const cur = audio.currentTime || 0;
                const dur = audio.duration;
                timeDisplay.textContent = fmtTime(cur) + ' / ' + (isFinite(dur) ? fmtTime(dur) : '0:00');
            }

            function setPlayState(playing) {
                isPlaying = playing;
                playIcon.className = playing ? 'fas fa-pause' : 'fas fa-play';
                playBtn.setAttribute('aria-label', playing ? 'Tạm dừng' : 'Phát');
                playBtn.classList.toggle('playing', playing);
                if (playing) startVisualizer(); else stopVisualizer();
                coverEl.classList.toggle('playing', playing);
                markActiveSong();
            }

            function markActiveSong() {
                decoSongs.forEach((el, i) => {
                    el.classList.toggle('active', i === currentIndex);
                    el.classList.toggle('playing', i === currentIndex && isPlaying);
                });
            }

            function updateMediaSession() {
                if (!('mediaSession' in navigator)) return;
                const song = songList[currentIndex];
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: song.name,
                        artist: song.artist,
                        artwork: [{ src: song.img, sizes: '512x512', type: 'image/jpeg' }],
                    });
                } catch (_) {}
            }

            function setBuffering(b) { coverEl.classList.toggle('buffering', b); }

            function load(index, autoplay) {
                currentIndex = (index + songList.length) % songList.length;
                const song = songList[currentIndex];
                audio.src = song.src;
                trackName.textContent = song.name;
                artistName.textContent = song.artist;
                coverImg.src = song.img;
                coverIcon.style.display = 'none';
                errorShown = false;
                progressBar.style.width = '0%';
                progressBuf.style.width = '0%';
                markActiveSong();
                updateMediaSession();
                updateTime();
                if (autoplay) play();
            }

            function play() {
                const p = audio.play();
                if (p && typeof p.then === 'function') {
                    p.then(() => setPlayState(true)).catch((err) => {
                        if (err && err.name === 'NotAllowedError') setPlayState(false);
                        else { console.warn('[Player] play() thất bại:', err); setPlayState(false); }
                    });
                } else {
                    setPlayState(true);
                }
            }
            function pause() { audio.pause(); setPlayState(false); }
            function toggle() { if (audio.paused) play(); else pause(); }

            function setMuted(m) {
                isMuted = m;
                audio.muted = m;
                muteIcon.className = m ? 'fas fa-volume-mute' : 'fas fa-volume-up';
                muteBtn.classList.toggle('muted', m);
                muteBtn.setAttribute('aria-label', m ? 'Bật tiếng' : 'Tắt tiếng');
            }

            audio.addEventListener('loadedmetadata', () => { setBuffering(false); updateTime(); });
            audio.addEventListener('waiting', () => setBuffering(true));
            audio.addEventListener('playing', () => setBuffering(false));
            audio.addEventListener('canplay', () => setBuffering(false));
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressBar.style.width = pct + '%';
                    progressWrap.setAttribute('aria-valuenow', Math.round(pct));
                }
                updateTime();
            });
            audio.addEventListener('progress', () => {
                if (!audio.duration || !audio.buffered.length) return;
                const end = audio.buffered.end(audio.buffered.length - 1);
                progressBuf.style.width = Math.min(100, (end / audio.duration) * 100) + '%';
            });
            audio.addEventListener('play',  () => setPlayState(true));
            audio.addEventListener('pause', () => setPlayState(false));
            audio.addEventListener('ended', () => load(currentIndex + 1, true));
            audio.addEventListener('error', () => {
                setBuffering(false);
                if (errorShown) return;
                errorShown = true;
                setPlayState(false);
                const err = audio.error;
                console.warn('[Player] Lỗi audio — mã:', err ? err.code : '?',
                             'thông báo:', err ? (err.message || '?') : '?',
                             'nguồn:', audio.src);
                trackName.textContent = '⚠️ Không tải được file nhạc';
                artistName.textContent = 'Kiểm tra đường dẫn: ' + (audio.currentSrc || audio.src);
            });

            playBtn.addEventListener('click', toggle);
            prevBtn.addEventListener('click', () => load(currentIndex - 1, true));
            nextBtn.addEventListener('click', () => load(currentIndex + 1, true));
            muteBtn.addEventListener('click', () => setMuted(!isMuted));

            decoSongs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index, 10);
                    if (idx === currentIndex && isPlaying) { pause(); return; }
                    load(idx, true);
                });
            });

            let dragging = false;
            function seekFromEvent(e) {
                const rect = progressWrap.getBoundingClientRect();
                const x = (e.clientX ?? 0) - rect.left;
                const pct = Math.min(1, Math.max(0, x / rect.width));
                if (audio.duration) {
                    audio.currentTime = pct * audio.duration;
                    progressBar.style.width = (pct * 100) + '%';
                }
            }
            progressWrap.addEventListener('pointerdown', (e) => {
                dragging = true;
                progressWrap.classList.add('dragging');
                if (progressWrap.setPointerCapture) progressWrap.setPointerCapture(e.pointerId);
                seekFromEvent(e);
            });
            progressWrap.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
            const endDrag = () => { dragging = false; progressWrap.classList.remove('dragging'); };
            progressWrap.addEventListener('pointerup', endDrag);
            progressWrap.addEventListener('pointercancel', endDrag);
            progressWrap.addEventListener('keydown', (e) => {
                if (!audio.duration) return;
                if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
                if (e.key === 'ArrowLeft')  { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
            });

            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.setActionHandler('play',  play);
                    navigator.mediaSession.setActionHandler('pause', pause);
                    navigator.mediaSession.setActionHandler('previoustrack', () => load(currentIndex - 1, true));
                    navigator.mediaSession.setActionHandler('nexttrack',     () => load(currentIndex + 1, true));
                } catch (_) {}
            }

            load(0, false);

            return {
                play, pause, toggle, load,
                isPlaying: () => isPlaying,
                songs: songList,
                playerEl,
            };
        })();

        (function initEnter() {
            const screen  = $('#enter-screen');
            const btn     = $('#enterBtn');
            const wrapper = $('#mainWrapper');
            const canvas  = $('#enter-canvas');
            const ctx     = canvas.getContext('2d');

            let w = 0, h = 0;
            let particles = [];
            let animating = true;
            let entered   = false;

            function resize() {
                w = canvas.width  = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function makeParticle() {
                return {
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2.2 + 0.4,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    color: ['167,139,250', '244,114,182', '110,231,183'][(Math.random() * 3) | 0],
                    alpha: Math.random() * 0.35 + 0.1,
                };
            }

            const COUNT = prefersReduced ? 40 : 80;
            for (let i = 0; i < COUNT; i++) particles.push(makeParticle());

            if (!prefersReduced) {
                screen.addEventListener('mousemove', (e) => {
                    const mx = e.clientX, my = e.clientY;
                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        const dx = mx - p.x, dy = my - p.y;
                        const d2 = dx * dx + dy * dy;
                        if (d2 < 140 * 140) {
                            p.x -= dx * 0.018;
                            p.y -= dy * 0.018;
                        }
                    }
                });
            }

            function step() {
                if (!animating) return;
                if (!pageVisible) {
                    requestAnimationFrame(step);
                    return;
                }
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + p.color + ',' + p.alpha + ')';
                    ctx.fill();
                }
                if (!prefersReduced) {
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const d2 = dx * dx + dy * dy;
                            if (d2 < 140 * 140) {
                                const d = Math.sqrt(d2);
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = 'rgba(167,139,250,' + (0.035 * (1 - d / 140)) + ')';
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                }
                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);

            function enter() {
                if (entered) return;
                entered = true;
                screen.classList.add('hidden');
                wrapper.classList.add('visible');
                $$('.reveal').forEach(el => el.classList.add('visible'));
                animating = false;

                const nameEl = $('#profile-name');
                if (nameEl) nameEl.classList.add('revealed');

                Player.play();
                setTimeout(startBioTyping, 1100);
            }

            btn.addEventListener('click', (e) => { e.stopPropagation(); enter(); });
            screen.addEventListener('click', enter);
            screen.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !screen.classList.contains('hidden')) enter();
            });
        })();

        function startBioTyping() {
            const el = $('#bioTyping');
            const cursor = $('#bioCursor');
            if (!el || el.dataset.typed) return;
            el.dataset.typed = '1';

            const text = el.dataset.text || '';
            const chars = [...text];
            let i = 0;

            function type() {
                if (i <= chars.length) {
                    el.textContent = chars.slice(0, i).join('');
                    i++;
                    setTimeout(type, 42 + Math.random() * 35);
                } else if (cursor) {
                    setTimeout(() => cursor.classList.add('done'), 900);
                }
            }
            type();
        }

                const img = document.createElement('img');
                img.src = src;
