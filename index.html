<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BinSu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0718;
            --bg-card: rgba(16, 12, 40, 0.88);
            --text-primary: #f0ecff;
            --text-secondary: #c8c0e8;
            --text-muted: #7a729a;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.8);
            --card-radius: 2.4rem;
            --transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            --accent-1: #a78bfa;
            --accent-2: #f472b6;
            --accent-3: #6ee7b7;
            --accent-glow: rgba(167, 139, 250, 0.25);
            --gradient-main: linear-gradient(135deg, #a78bfa, #f472b6, #6ee7b7);
            --gradient-heart: linear-gradient(135deg, #a78bfa, #f472b6);
            --card-border-glow: rgba(167, 139, 250, 0.25);
            --card-border-width: 2px;
            --will-change: transform, opacity;
        }

        body.light-mode {
            --bg-primary: #fcf4f8;
            --bg-card: rgba(255, 248, 250, 0.85);
            --text-primary: #3a1a3a;
            --text-secondary: #7a4a6a;
            --text-muted: #b88aaa;
            --border-color: rgba(220, 180, 200, 0.25);
            --shadow-color: rgba(200, 160, 180, 0.12);
            --accent-1: #f5a0c0;
            --accent-2: #f5a0c0;
            --accent-3: #f5c0d0;
            --accent-glow: rgba(245, 160, 192, 0.20);
            --gradient-main: linear-gradient(135deg, #f8b0c8, #f5c0d8, #fdd0d8);
            --gradient-heart: linear-gradient(135deg, #f8b0c8, #f5c0d8);
            --card-border-glow: rgba(245, 160, 192, 0.35);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 0.6s ease, color 0.6s ease;
            padding-bottom: 110px;
            will-change: background, color;
        }

        /* ===== NỀN GRADIENT CHUYỂN ĐỘNG ===== */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: var(--gradient-main);
            background-size: 400% 400%;
            opacity: 0.06;
            animation: bgMove 20s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== LỚP PHỦ NỀN ===== */
        .overlay-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            transition: background 0.6s ease;
            background:
                radial-gradient(circle at 20% 30%, rgba(167, 139, 250, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(244, 114, 182, 0.04) 0%, transparent 45%),
                radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.6) 100%);
            will-change: background;
        }
        body.light-mode .overlay-bg {
            background:
                radial-gradient(circle at 20% 30%, rgba(245, 160, 192, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245, 192, 208, 0.06) 0%, transparent 45%),
                radial-gradient(circle at center, rgba(255, 240, 245, 0.15) 0%, rgba(255, 240, 245, 0.3) 100%);
        }

        /* ===== SAO TRANG TRÍ ===== */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: 0.3;
            will-change: transform, opacity;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== MÂY TRẮNG ===== */
        .clouds-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        body.light-mode .clouds-container { opacity: 1; }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 1000px;
            filter: blur(2px);
            animation: floatCloud var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 8px 50px rgba(255, 255, 255, 0.12), 0 0 80px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            will-change: transform;
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
            box-shadow: inherit;
            border: inherit;
        }
        .cloud::before { width: 60%; height: 85%; top: -45%; left: 8%; }
        .cloud::after { width: 40%; height: 65%; top: -35%; right: 8%; }
        @keyframes floatCloud {
            0% { transform: translateX(-30px) scale(1); }
            100% { transform: translateX(30px) scale(1.04); }
        }

        /* ===== HẠT BỤI SÁNG ===== */
        .dust-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .dust {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: floatDust var(--duration) ease-in-out infinite alternate;
            will-change: transform, opacity;
            filter: blur(1px);
        }
        @keyframes floatDust {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0.6; }
        }

        /* ===== MẶT TRĂNG & MẶT TRỜI ===== */
        .celestial-container {
            position: fixed;
            top: 60px;
            right: 40px;
            z-index: 2;
            pointer-events: none;
            transition: all 0.6s ease;
        }
        @media (max-width: 650px) {
            .celestial-container { top: 70px; right: 16px; transform: scale(0.7); }
        }

        .moon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f8f8ff, #d0d0e0);
            box-shadow: 0 0 60px rgba(200,200,230,0.15), inset -8px -4px 30px rgba(80,80,120,0.3);
            position: relative;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: scale(1);
            will-change: transform, opacity;
        }
        body.light-mode .moon {
            opacity: 0;
            transform: scale(0.5) rotate(45deg);
            pointer-events: none;
        }
        .moon .crater {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(160,160,180,0.35), rgba(120,120,140,0.15));
            box-shadow: inset -2px -2px 10px rgba(60,60,80,0.2);
        }
        .moon .crater:nth-child(1) { width: 20px; height: 20px; top: 14px; left: 16px; }
        .moon .crater:nth-child(2) { width: 14px; height: 14px; top: 42px; left: 44px; }
        .moon .crater:nth-child(3) { width: 24px; height: 24px; top: 48px; left: 8px; }
        .moon .crater:nth-child(4) { width: 10px; height: 10px; top: 24px; left: 56px; }
        .moon .crater:nth-child(5) { width: 16px; height: 16px; top: 6px; left: 40px; }

        .sun {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #fff8e8, #fdd0a0, #f5b080, #e89860);
            box-shadow: 0 0 80px rgba(255,200,150,0.35), 0 0 160px rgba(255,200,150,0.12);
            position: absolute;
            top: -5px;
            left: -5px;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 0;
            transform: scale(0.5) rotate(-45deg);
            will-change: transform, opacity;
        }
        body.light-mode .sun {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        .sun .ray {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,220,180,0.4), transparent);
            animation: sunPulse 3s ease-in-out infinite;
            will-change: transform, opacity;
        }
        .sun .ray:nth-child(1) { width: 110px; height: 110px; top: -10px; left: -10px; animation-delay: 0s; }
        .sun .ray:nth-child(2) { width: 130px; height: 130px; top: -20px; left: -20px; animation-delay: 0.6s; opacity: 0.5; }
        .sun .ray:nth-child(3) { width: 160px; height: 160px; top: -35px; left: -35px; animation-delay: 1.2s; opacity: 0.3; }
        @keyframes sunPulse {
            0%,100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.12); opacity: 1; }
        }
        .sun .face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: #ff8800;
            text-shadow: 0 0 40px rgba(255,150,50,0.3);
            animation: sunFace 4s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes sunFace {
            0%,100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.06) rotate(6deg); }
        }
        .sun .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255,220,180,0.6);
            border-radius: 50%;
            animation: sparkleMove 2.5s ease-in-out infinite;
            will-change: transform, opacity;
        }
        .sun .sparkle:nth-child(4) { top: -8px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
        .sun .sparkle:nth-child(5) { bottom: -8px; left: 50%; transform: translateX(-50%); animation-delay: 0.8s; }
        .sun .sparkle:nth-child(6) { top: 50%; left: -8px; transform: translateY(-50%); animation-delay: 1.6s; }
        .sun .sparkle:nth-child(7) { top: 50%; right: -8px; transform: translateY(-50%); animation-delay: 0.4s; }
        @keyframes sparkleMove {
            0%,100% { opacity: 0.2; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* ===== NÚT CHUYỂN CHẾ ĐỘ ===== */
        .theme-btn-float {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 2px solid var(--card-border-glow);
            border-radius: 60px;
            padding: 0.5rem 1.0rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 30px var(--shadow-color);
            will-change: transform, border-color, box-shadow;
        }
        .theme-btn-float:hover {
            transform: scale(1.05);
            border-color: var(--accent-1);
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .theme-btn-float i { font-size: 1.0rem; color: var(--accent-1); }

        /* ===== ENTER SCREEN ===== */
        #enter-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1.0s ease, transform 1.0s ease;
            overflow: hidden;
            will-change: transform, opacity;
        }
        #enter-screen.hidden { opacity: 0; transform: scale(1.06); pointer-events: none; }
        #enter-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .enter-content {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
        }
        .enter-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--gradient-heart);
            padding: 5px;
            animation: enterPulse 3s ease-in-out infinite;
            box-shadow: 0 0 80px var(--accent-glow);
            will-change: transform, box-shadow;
        }
        .enter-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: var(--bg-primary);
        }
        @keyframes enterPulse {
            0%,100% { transform: scale(1); box-shadow: 0 0 80px var(--accent-glow); }
            50% { transform: scale(1.04); box-shadow: 0 0 120px var(--accent-glow); }
        }
        .enter-title {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transform: translateY(20px);
            animation: enterFade 0.8s ease forwards 0.4s;
            will-change: transform, opacity;
        }
        @keyframes enterFade { to { opacity: 1; transform: translateY(0); } }
        .enter-key {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 2.6rem;
            border: 2px solid rgba(167,139,250,0.3);
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-1);
            background: rgba(167,139,250,0.04);
            backdrop-filter: blur(8px);
            transition: var(--transition);
            cursor: pointer;
            animation: enterPulseKey 2.2s ease-in-out infinite;
            will-change: transform, box-shadow, border-color;
        }
        .enter-key:hover {
            background: rgba(167,139,250,0.12);
            border-color: var(--accent-1);
            transform: scale(1.05);
            box-shadow: 0 0 60px var(--accent-glow);
        }
        @keyframes enterPulseKey {
            0%,100% { box-shadow: 0 0 20px rgba(167,139,250,0.05); }
            50% { box-shadow: 0 0 50px rgba(167,139,250,0.12); }
        }
        .enter-key i { animation: enterArrow 1.0s ease-in-out infinite alternate; will-change: transform; }
        @keyframes enterArrow {
            0% { transform: translateX(-6px); opacity: 0.5; }
            100% { transform: translateX(10px); opacity: 1; }
        }
        .enter-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 6px;
            font-weight: 300;
            opacity: 0.6;
            animation: enterFade 0.8s ease forwards 0.8s;
            opacity: 0;
            transform: translateY(10px);
            will-change: transform, opacity;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 820px;
            margin: 0 auto;
            padding: 2.5rem 1.2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
            will-change: transform, opacity;
        }
        .main-wrapper.visible { opacity: 1; transform: translateY(0); }

        /* ===== CARD ===== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: var(--card-radius);
            padding: 1.8rem 1.8rem 1.5rem;
            border: var(--card-border-width) solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow, border-color;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--card-radius) + 2px);
            background: var(--gradient-main);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 8s ease infinite;
            opacity: 0.25;
            will-change: background-position;
        }
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            border: var(--card-border-width) solid transparent;
            background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                var(--gradient-main) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.3;
        }
        @keyframes borderGlow {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px var(--shadow-color), 0 0 40px var(--card-border-glow);
            border-color: var(--card-border-glow);
        }

        /* ===== PROFILE ===== */
        .card-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2.4rem 1.6rem 1.6rem;
        }
        .avatar-wrap {
            position: relative;
            margin-bottom: 0.6rem;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--gradient-heart);
            padding: 5px;
            box-shadow: 0 8px 40px var(--accent-glow);
            transition: var(--transition);
            cursor: pointer;
            will-change: transform, box-shadow;
        }
        .avatar:hover { transform: scale(1.04) rotate(-3deg); }
        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: var(--bg-primary);
        }
        .status-ring {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background: var(--accent-3);
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
            box-shadow: 0 0 30px rgba(110,231,183,0.5);
            animation: ringPulse 2s ease-in-out infinite;
            will-change: transform, box-shadow;
        }
        @keyframes ringPulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .name-group h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }
        body:not(.light-mode) .name-group h1 {
            color: #ffffff;
            text-shadow: 0 0 30px rgba(167,139,250,0.2), 0 0 60px rgba(167,139,250,0.05);
        }
        body.light-mode .name-group h1 {
            color: #6b3a4a;
            text-shadow: 0 0 20px rgba(245,160,192,0.15);
        }
        .name-group .handle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .name-group .handle i { color: var(--accent-1); margin-right: 4px; }
        .bio-text {
            margin: 0.6rem 0 0.8rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .bio-text i { color: var(--accent-2); margin: 0 3px; }

        /* ===== SOCIAL ===== */
        .social-under {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin: 0.2rem 0 0.4rem;
            flex-wrap: wrap;
        }
        .social-under a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 1.3rem;
            transition: var(--transition);
            text-decoration: none;
            position: relative;
            will-change: transform, box-shadow, border-color;
        }
        .social-under a::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: var(--gradient-main);
            opacity: 0;
            z-index: -1;
            transition: 0.3s;
            filter: blur(6px);
            will-change: opacity;
        }
        .social-under a:hover::after { opacity: 0.4; }
        .social-under a:hover {
            transform: translateY(-4px) scale(1.10);
            background: rgba(255,255,255,0.08);
            border-color: var(--accent-1);
            box-shadow: 0 12px 40px var(--accent-glow);
            color: #fff;
        }
        .social-under a.discord:hover { background: #5865f2; border-color: #5865f2; }
        .social-under a.facebook:hover { background: #1877f2; border-color: #1877f2; }
        .social-under a.tiktok:hover { background: #000; border-color: #fff; }
        .social-under a.instagram:hover { background: #e4405f; border-color: #e4405f; }

        /* ===== GIỚI THIỆU + TRANG TRÍ ===== */
        .info-card .intro {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1.2rem;
            padding: 0 0.2rem;
        }
        .info-card .intro i { color: var(--accent-2); margin: 0 4px; }

        .deco-songs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }
        .deco-song {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 0.8rem 0.4rem 0.4rem;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: default;
            flex: 0 1 auto;
            min-width: 140px;
            will-change: transform, background, border-color;
        }
        .deco-song:hover {
            background: rgba(167,139,250,0.04);
            transform: scale(1.02);
        }
        .deco-song .song-img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;

            height: 100%;

            font-size: 0.8rem;
            color: var(--text-primary);

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;

            align-items: center;

        /* ===== GALLERY ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }
        .gallery-item {
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: var(--gradient-heart);
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            will-change: transform, box-shadow;

        .gallery-item:hover {
            transform: scale(1.04) translateY(-4px);
            box-shadow: 0 12px 40px var(--accent-glow);

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-item .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            font-size: 1.4rem;
            color: #fff;
            will-change: opacity;
        }
        .gallery-item:hover .overlay { opacity: 1; }
        .gallery-item.clicked { animation: galleryClick 0.5s ease; }
        @keyframes galleryClick {
            0% { transform: scale(1); }
            30% { transform: scale(0.92); }
            60% { transform: scale(1.06); }
            100% { transform: scale(1); }

        /* ===== LIGHTBOX – ZOOM ẢNH FULL MÀN HÌNH ===== */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            cursor: pointer;
            padding: 2rem;
        }
        .lightbox-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .lightbox-overlay .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            cursor: default;
            transform: scale(0.8) translateY(30px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8);
        }
        .lightbox-overlay.active .lightbox-content {
            transform: scale(1) translateY(0);
        }
        .lightbox-overlay .lightbox-content img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 20px;
        }
        .lightbox-overlay .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.8rem;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            opacity: 0.7;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .lightbox-overlay .lightbox-close:hover {
            opacity: 1;
            transform: rotate(90deg) scale(1.1);
        }
        .lightbox-overlay .lightbox-counter {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        .lightbox-overlay .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
            user-select: none;
        }
        .lightbox-overlay .lightbox-nav:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .lightbox-overlay .lightbox-nav.prev {
            left: 20px;
        }
        .lightbox-overlay .lightbox-nav.next {
            right: 20px;
        }
        @media (max-width: 650px) {
            .lightbox-overlay .lightbox-nav {
                font-size: 2rem;
                padding: 0.3rem 0.6rem;
            }
            .lightbox-overlay .lightbox-nav.prev { left: 10px; }
            .lightbox-overlay .lightbox-nav.next { right: 10px; }
            .lightbox-overlay .lightbox-close {
                top: 12px;
                right: 18px;
                font-size: 2.2rem;
            }
            .lightbox-overlay .lightbox-counter {
                font-size: 0.6rem;
                padding: 0.2rem 0.8rem;
                bottom: 15px;
            }
            .lightbox-overlay { padding: 1rem; }
        }

        /* ===== FOOTER ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 0.8rem;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .clock {
            font-variant-numeric: tabular-nums;
            background: rgba(255,255,255,0.02);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 0.55rem;
        }

        /* ============================================================
           PLAYER CỐ ĐỊNH
           ============================================================ */
        .fixed-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 2px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            box-shadow: 0 -10px 50px var(--shadow-color);
            transition: background 0.4s ease;
            will-change: transform, box-shadow;
        }
        .fixed-player::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: var(--gradient-main);
            border-radius: 10px;
            opacity: 0.5;
            animation: playerGlow 3s ease-in-out infinite;
            will-change: transform, opacity;
        }
        @keyframes playerGlow {
            0%,100% { opacity: 0.2; transform: scaleX(0.8); }
            50% { opacity: 0.7; transform: scaleX(1); }
        }

        .player-inner {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            max-width: 820px;
            margin: 0 auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-cover {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--gradient-heart);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid var(--border-color);
            will-change: transform, box-shadow;
        }
        .player-cover:hover { transform: scale(1.05); }
        .player-cover .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .player-cover .cover-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
        }
        .player-info {
            flex: 1;
            min-width: 120px;
        }
        .player-info .track {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-info .artist {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }
        .player-controls .time {
            font-size: 0.55rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 48px;
            text-align: right;
        }
        .player-controls button {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
            padding: 0 3px;
            will-change: transform, color;
        }
        .player-controls button:hover {
            color: var(--accent-1);
            transform: scale(1.12);
        }
        #playBtn {
            font-size: 1.5rem;
            padding: 0 4px;
        }

        .progress-wrap {
            flex: 1;
            height: 4px;
            background: rgba(167,139,250,0.08);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            min-width: 60px;
            transition: height 0.2s;
            will-change: height;
        }
        .progress-wrap:hover { height: 6px; }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gradient-heart);
            border-radius: 10px;
            transition: width 0.1s linear;
            position: relative;
            will-change: width;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: var(--accent-1);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--accent-glow);
            opacity: 0;
            transition: 0.2s;
            will-change: opacity;
        }
        .progress-wrap:hover .progress-bar::after { opacity: 1; }

        /* ===== SÓNG ÂM THANH ===== */
        .music-visualizer {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 26px;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .music-visualizer .bar {
            width: 3px;
            height: 100%;
            background: var(--accent-1);
            border-radius: 4px;
            transition: height 0.15s ease;
            opacity: 0.4;
            will-change: height, opacity;
        }
        .music-visualizer .bar.active {
            opacity: 1;
            animation: waveBounce 0.5s ease-in-out infinite alternate;
        }
        .music-visualizer .bar:nth-child(1) { animation-delay: 0.00s; }
        .music-visualizer .bar:nth-child(2) { animation-delay: 0.05s; }
        .music-visualizer .bar:nth-child(3) { animation-delay: 0.10s; }
        .music-visualizer .bar:nth-child(4) { animation-delay: 0.15s; }
        .music-visualizer .bar:nth-child(5) { animation-delay: 0.20s; }
        .music-visualizer .bar:nth-child(6) { animation-delay: 0.25s; }
        .music-visualizer .bar:nth-child(7) { animation-delay: 0.30s; }
        .music-visualizer .bar:nth-child(8) { animation-delay: 0.35s; }
        .music-visualizer .bar:nth-child(9) { animation-delay: 0.40s; }
        .music-visualizer .bar:nth-child(10) { animation-delay: 0.45s; }
        .music-visualizer .bar:nth-child(11) { animation-delay: 0.50s; }
        .music-visualizer .bar:nth-child(12) { animation-delay: 0.55s; }
        @keyframes waveBounce {
            0% { height: 15%; transform: scaleY(0.4); }
            100% { height: 95%; transform: scaleY(1); }
        }

        /* ===== HIỆU ỨNG CLICK – RIPPLE + SPARKLE ===== */
        .click-effect-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            pointer-events: none;
            will-change: transform;
        }

        .click-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--accent-1);
            background: transparent;
            animation: rippleAnim 0.9s ease-out forwards;
            will-change: transform, opacity;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }

        .click-sparkle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            animation: sparkleFly 0.8s ease-out forwards;
        }
        @keyframes sparkleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 650px) {
            .main-wrapper { padding: 1.2rem 0.8rem 1.5rem; gap: 1.2rem; }
            .card { padding: 1.2rem 1.0rem; }
            .avatar { width: 84px; height: 84px; }
            .name-group h1 { font-size: 1.8rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .gallery-grid .gallery-item:nth-child(3) { display: none; }
            .enter-title { font-size: 2.2rem; }
            .enter-logo { width: 100px; height: 100px; }
            .enter-key { font-size: 1.0rem; padding: 0.6rem 1.8rem; }
            .deco-song { min-width: 120px; padding: 0.3rem 0.6rem 0.3rem 0.3rem; }
            .deco-song .song-img { width: 36px; height: 36px; }
            .deco-song .song-info .name { font-size: 0.7rem; }
            .player-inner { gap: 0.5rem; }
            .player-cover { width: 38px; height: 38px; font-size: 1.0rem; }
            .player-info .track { font-size: 0.7rem; }
            .player-controls .time { font-size: 0.5rem; min-width: 40px; }
            #playBtn { font-size: 1.2rem; }
            .player-controls button { font-size: 1.0rem; }
            .theme-btn-float { top: 12px; right: 12px; padding: 0.3rem 0.7rem; font-size: 0.7rem; }
            .theme-btn-float span { display: none; }
            .music-visualizer { height: 20px; gap: 1.5px; }
            .music-visualizer .bar { width: 2px; }
            .fixed-player { padding: 0.4rem 0.8rem; }
            .celestial-container { top: 60px; right: 12px; transform: scale(0.6); }
        }
        @media (max-width: 400px) {
            .gallery-grid { grid-template-columns: 1fr 1fr; }
            .gallery-grid .gallery-item:nth-child(3) { display: none; }
            .social-under a { width: 40px; height: 40px; font-size: 1.0rem; }
            .enter-title { font-size: 1.6rem; }
            .enter-logo { width: 70px; height: 70px; }
            .enter-key { font-size: 0.8rem; padding: 0.4rem 1.2rem; }
            .deco-song { min-width: 100px; }
            .player-inner { flex-wrap: wrap; justify-content: center; }
            .player-info { text-align: center; flex: 0 0 100%; order: 3; }
            .player-controls { justify-content: center; flex: 1; order: 2; }
            .progress-wrap { order: 4; flex: 0 0 100%; }
            .music-visualizer { order: 1; }
            .celestial-container { transform: scale(0.5); top: 50px; right: 8px; }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            will-change: transform, opacity;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>

    <script>
        (function() {

            // ==========================================================
            // 1. ENTER SCREEN
            // ==========================================================
            (function() {
                var canvas = document.getElementById('enter-canvas');
                var ctx = canvas.getContext('2d');
                var w, h;
                var particles = [];
                var NUM = 120;

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                function Particle() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.7;
                    this.speedY = (Math.random() - 0.5) * 0.7;
                    this.opacity = Math.random() * 0.3 + 0.1;
                    var colors = ['rgba(167,139,250,', 'rgba(244,114,182,', 'rgba(110,231,183,'];
                    this.color = colors[Math.floor(Math.random() * colors.length)] + this.opacity + ')';
                }
                Particle.prototype.update = function() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                };
                Particle.prototype.draw = function() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                };

                for (var i = 0; i < NUM; i++) { particles.push(new Particle()); }

                function drawLines() {
                    for (var i = 0; i < particles.length; i++) {
                        for (var j = i + 1; j < particles.length; j++) {
                            var dx = particles[i].x - particles[j].x;
                            var dy = particles[i].y - particles[j].y;
                            var dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 160) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = 'rgba(167,139,250,' + (0.03 * (1 - dist / 160)) + ')';
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                }

                function animateEnter() {
                    ctx.clearRect(0, 0, w, h);
                    for (var i = 0; i < particles.length; i++) {
                        particles[i].update();
                        particles[i].draw();
                    }
                    drawLines();
                    requestAnimationFrame(animateEnter);
                }
                animateEnter();

                var enterScreen = document.getElementById('enter-screen');
                var enterBtn = document.getElementById('enterBtn');
                var mainWrapper = document.getElementById('mainWrapper');

                function enterSite() {
                    enterScreen.classList.add('hidden');
                    mainWrapper.classList.add('visible');
                    document.querySelectorAll('.fade-up:not(.visible)').forEach(function(el) {
                        el.classList.add('visible');
                    });
                    setTimeout(function() {
                        if (audio && !isPlaying) {
                            audio.play().catch(function() {});
                            icon.className = 'fas fa-pause';
                            isPlaying = true;
                            updateVisualizer(true);
                            if (visualizerInterval) clearInterval(visualizerInterval);
                            visualizerInterval = setInterval(randomizeVisualizer, 300);
                        }
                    }, 800);
                }

                enterBtn.addEventListener('click', enterSite);
                enterScreen.addEventListener('click', function(e) {
                    if (e.target === this || e.target.closest('.enter-content')) { enterSite(); }
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !enterScreen.classList.contains('hidden')) { enterSite(); }
                });
            })();

            // ==========================================================

            // ==========================================================
            var lightboxOverlay = document.getElementById('lightboxOverlay');
            var lightboxImage = document.getElementById('lightboxImage');
            var lightboxCounter = document.getElementById('lightboxCounter');
            var lightboxClose = document.getElementById('lightboxClose');
            var lightboxPrev = document.getElementById('lightboxPrev');
            var lightboxNext = document.getElementById('lightboxNext');

            function openLightbox(index) {
                if (!window.lightboxImages || window.lightboxImages.length === 0) return;
                window.lightboxIndex = index;
                updateLightbox();
                lightboxOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightboxOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function updateLightbox() {
                var imgSrc = window.lightboxImages[window.lightboxIndex];
                lightboxImage.src = imgSrc;
                lightboxImage.alt = 'Ảnh ' + (window.lightboxIndex + 1);
                lightboxCounter.textContent = (window.lightboxIndex + 1) + ' / ' + window.lightboxImages.length;
            }

            function prevImage(e) {
                e.stopPropagation();
                if (window.lightboxIndex > 0) {
                    window.lightboxIndex--;
                    updateLightbox();
                }
            }

            function nextImage(e) {
                e.stopPropagation();
                if (window.lightboxIndex < window.lightboxImages.length - 1) {
                    window.lightboxIndex++;
                    updateLightbox();
                }
            }

            // Sự kiện lightbox
            lightboxClose.addEventListener('click', closeLightbox);
            lightboxOverlay.addEventListener('click', function(e) {
                if (e.target === lightboxOverlay) closeLightbox();
            });

                if (!lightboxOverlay.classList.contains('active')) return;

            // ==========================================================

            // ==========================================================
            var songList = [
                { name: 'Đừng làm trái tim anh đau(rmk)', artist: 'Obito', img: 'images/songs/song1.jpg',
                src: 'audio/song1.mp3' },

            var audio = new Audio();

            function loadSong(index) {
                var song = songList[index];
                audio.src = song.src;
                trackName.textContent = song.name;
                artistName.textContent = song.artist;
                coverImg.src = song.img;
                document.querySelector('.player-cover .cover-icon').style.display = 'none';
                if (isPlaying) {
                    audio.play().catch(function() {});
                }
                updateTime();
                document.querySelectorAll('.deco-song').forEach(function(el, i) {
                    if (i === index) {
                        el.style.borderColor = 'var(--accent-1)';
                        el.style.background = 'rgba(167,139,250,0.08)';
                    } else {
                        el.style.borderColor = 'var(--border-color)';
                        el.style.background = 'rgba(255,255,255,0.03)';
                    }
                });
            }

            function updateTime() {
                if (audio.duration) {
                    var cur = audio.currentTime || 0;
                    var total = audio.duration;
                    var cm = Math.floor(cur / 60),
                        cs = Math.floor(cur % 60);
                    var tm = Math.floor(total / 60),
                        ts = Math.floor(total % 60);
                    timeDisplay.textContent =
                        cm + ':' + (cs < 10 ? '0' : '') + cs +
                        ' / ' +
                        tm + ':' + (ts < 10 ? '0' : '') + ts;
                } else {
                    timeDisplay.textContent = '0:00 / 0:00';
                }
            }

            function updateVisualizer(play) {
                visualizerBars.forEach(function(bar) {
                    if (play) {
                        bar.classList.add('active');
                    } else {
                        bar.classList.remove('active');
                    }
                });
                if (play) {
                    if (visualizerInterval) clearInterval(visualizerInterval);
                    visualizerInterval = setInterval(randomizeVisualizer, 300);
                } else {
                    if (visualizerInterval) {
                        clearInterval(visualizerInterval);
                        visualizerInterval = null;
                    }
                    visualizerBars.forEach(function(bar) {
                        bar.style.height = '';
                    });
                }
            }

            function randomizeVisualizer() {
                if (!isPlaying) return;
                visualizerBars.forEach(function(bar) {
                    var h = 20 + Math.random() * 80;
                    bar.style.height = h + '%';
                });
            }

            audio.addEventListener('loadedmetadata', updateTime);
            audio.addEventListener('timeupdate', function() {
                if (audio.duration) {
                    progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
                    updateTime();
                }
            });
            audio.addEventListener('ended', function() {
                currentSongIndex = (currentSongIndex + 1) % songList.length;
                loadSong(currentSongIndex);
                if (isPlaying) {
                    audio.play().catch(function() {});

            playBtn.addEventListener('click', function() {

                    updateVisualizer(false);
                } else {
                    if (!audio.src) { loadSong(currentSongIndex); }
                    audio.play().catch(function(err) {});

                    isPlaying = true;

                var x = e.clientX - rect.left;
                var pct = x / rect.width;
                if (audio.duration) {
                    audio.currentTime = pct * audio.duration;
                }
            });

                trackName.textContent = '⚠️ Không tìm thấy file nhạc';
            });

            loadSong(0);
            setTimeout(updateTime, 500);

            (function() {
                var container = document.getElementById('clickEffectContainer');

                function createClickEffect(e) {

                    // Tạo ripple
                    var ripple = document.createElement('div');
                    ripple.className = 'click-ripple';

                    // Xóa ripple sau animation
                    setTimeout(function() {
                        if (ripple.parentNode) ripple.remove();
                    }, 1000);

                    // Giới hạn số lượng ripple
                    ripples.push(ripple);
                    if (ripples.length > maxRipples) {
                        var old = ripples.shift();
                        if (old.parentNode) old.remove();
                    }

                    // Tạo sparkles
                    for (var i = 0; i < sparkleCount; i++) {
                        var sparkle = document.createElement('div');
                        sparkle.className = 'click-sparkle';

                        sparkle.style.width = sizeS + 'px';
                        sparkle.style.height = sizeS + 'px';

                        sparkle.style.top = y + 'px';

                document.addEventListener('click', createClickEffect);

// 10. SOCIAL LINKS + DISCORD COPY
// ==========================================================
(function() {
    // --- Cấu hình link và văn bản cần sao chép ---
    const SOCIAL_LINKS = {
        facebook: 'https://www.facebook.com/bin.su.359755',      // 👈 Thay link Facebook của bạn
        tiktok: 'https://www.tiktok.com/@binsu1608',         // 👈 Thay link TikTok
        instagram: 'https://www.instagram.com/binsu1608/',    // 👈 Thay link Instagram
    };

    const DISCORD_COPY_TEXT = '.catbin';               // 👈 Văn bản sẽ sao chép khi click Discord

    // --- Lấy tất cả các icon social ---
    const socialLinks = document.querySelectorAll('.social-under a');

    socialLinks.forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();

            // Xác định loại mạng xã hội dựa trên class
            const classList = this.classList;
            let type = null;
            if (classList.contains('discord')) type = 'discord';
            else if (classList.contains('facebook')) type = 'facebook';
            else if (classList.contains('tiktok')) type = 'tiktok';
            else if (classList.contains('instagram')) type = 'instagram';

            if (!type) return;

            // ---- XỬ LÝ DISCORD: sao chép văn bản ----
            if (type === 'discord') {
                copyToClipboard(DISCORD_COPY_TEXT)
                    .then(() => {
                        showToast('✅ Đã sao chép Discord: ' + DISCORD_COPY_TEXT);
                    })
                    .catch(() => {
                        // Fallback nếu clipboard không khả dụng
                        fallbackCopy(DISCORD_COPY_TEXT);
                    });
                return;
            }

            // ---- CÁC MẠNG KHÁC: chuyển hướng ----
            const url = SOCIAL_LINKS[type];
            if (url && url !== '#') {
                window.open(url, '_blank');  // Mở tab mới
                // Hoặc dùng: window.location.href = url; // Chuyển trang ngay
            } else {
                alert('🔗 Chưa cấu hình link cho ' + type);
            }
        });
    });

    // --- Hàm sao chép sử dụng Clipboard API ---
    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return Promise.reject('Clipboard API not supported');
    }

    // --- Fallback khi Clipboard API không hỗ trợ ---
    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('✅ Đã sao chép (phương thức dự phòng): ' + text);
        } catch (err) {
            alert('❌ Không thể sao chép. Vui lòng sao chép thủ công: ' + text);
        }
        document.body.removeChild(textarea);
    }

    // --- Hiển thị thông báo nhẹ (toast) ---
    function showToast(message) {
        // Tạo toast nếu chưa có
        let toast = document.getElementById('customToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'customToast';
            toast.style.cssText = `
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-card);
                backdrop-filter: blur(16px);
                padding: 0.8rem 2rem;
                border-radius: 40px;
                border: 1px solid var(--border-color);
                box-shadow: 0 8px 40px var(--shadow-color);
                color: var(--text-primary);
                font-size: 0.9rem;
                z-index: 99999;
                transition: opacity 0.4s ease, transform 0.4s ease;
                opacity: 0;
                pointer-events: none;
                white-space: nowrap;
                font-weight: 500;
            `;
            document.body.appendChild(toast);
        }

        toast.textContent = message;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';

        // Ẩn sau 2.5 giây
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(10px)';
        }, 2500);
    }

    // --- Giữ lại hiệu ứng click avatar (nếu cần) ---
    // (Phần này vẫn giữ nguyên, không thay đổi)
})();
            document.getElementById('avatarClick').addEventListener('click', function() {
                this.style.transform = 'scale(0.92)';
                setTimeout(() => { this.style.transform = 'scale(1.04) rotate(-3deg)'; }, 150);
                setTimeout(() => { this.style.transform = 'scale(1) rotate(0)'; }, 300);

                var nameEl = document.querySelector('.name-group h1');
                var isLight = document.body.classList.contains('light-mode');
                if (!isLight) {
                    nameEl.style.textShadow = '0 0 60px rgba(167,139,250,0.8), 0 0 120px rgba(167,139,250,0.3)';
                    setTimeout(() => {
                        nameEl.style.textShadow = '0 0 30px rgba(167,139,250,0.2), 0 0 60px rgba(167,139,250,0.05)';
                    }, 800);
                } else {
                    nameEl.style.textShadow = '0 0 40px rgba(245,160,192,0.5)';
                    setTimeout(() => {
                        nameEl.style.textShadow = '0 0 20px rgba(245,160,192,0.15)';
                    }, 800);
                }
            });

            // ==========================================================
            // 11. SCROLL ANIMATION
            // ==========================================================
            (function() {
                var els = document.querySelectorAll('.fade-up:not(.visible)');
                var obs = new IntersectionObserver(function(entries) {
                    entries.forEach(function(e) {
                        if (e.isIntersecting) {
                            e.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.15 });
                els.forEach(function(el) { obs.observe(el); });
            })();

            console.log('🌙 Profile BinSu cosmic đã sẵn sàng!');
            console.log('🖼️  Bấm vào ảnh gallery để zoom full màn hình!');
            console.log('✨ Hiệu ứng click mới: Ripple + Sparkle');
            console.log('🎵 Playlist có ' + songList.length + ' bài hát');
            console.log('💡 Click avatar để thấy hiệu ứng glow chữ!');

        })();
    </script>
